name: ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The engine whose plugin API the mod is written against (vendor/claude-code.d.ts).
  CLAUDE_CODE_VERSION: 2.1.299

# Jobs from the standard CI bar that do not apply to a Claude Code mod:
# - Build: a mod ships as source; the engine compiles it at load. `claude plugin validate`
#   (job `plugin`) is the build step: it reads the manifest and module the way the engine will.
# - E2E: there is no web app. `claude plugin test` mounts the pane and band on the terminal,
#   desktop and mobile surfaces through the engine itself, which is this mod's end-to-end check.
# - Database: the mod keeps JSON files in a local data folder; there are no migrations.

jobs:
  checks:
    name: install, format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm test
      - name: No personal data in the repository
        run: npm run check:personal-data

  plugin:
    name: plugin validate and plugin test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        shell: bash
        # npm's install-scripts gate can skip the package's postinstall, which leaves no native
        # binary on some runs. Run the postinstall explicitly (it is idempotent) and check it.
        run: |
          npm install --global --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version | grep -F "${CLAUDE_CODE_VERSION}"
      - name: Validate the mod (every hook matcher must be a literal the engine can read)
        # bash with pipefail, so a failing `claude plugin validate` is not hidden by `tee`.
        shell: bash
        run: |
          claude plugin validate . | tee validate.txt
          if grep -q '=?' validate.txt; then
            echo "A hook matcher is not a literal: the engine never matches it in a session." && exit 1
          fi
      - name: Plugin tests (terminal, desktop, mobile surfaces)
        run: claude plugin test .

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "A .env file is committed." && exit 1
          fi
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
